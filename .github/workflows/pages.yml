name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The same gate as local development, so the two can't drift apart.
      - run: npm run check
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SCRIPT_URL: ${{ vars.VITE_SCRIPT_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      # A missing or mistyped variable still builds, and deploying that build would swap the working
      # site for the "Not set up yet" screen or one that can't reach the server. Pull requests don't
      # deploy, and a fork's never get the variables. test/pagesWorkflow.test.ts runs this script.
      - name: Check the repository variables
        if: github.event_name != 'pull_request'
        env:
          VITE_SCRIPT_URL: ${{ vars.VITE_SCRIPT_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          # A Google Workspace account's web app URL has /a/macros/<domain>/ in place of /macros/.
          script_url_pattern='^https://script\.google\.com/(a/macros/[^/]+|macros)/s/[A-Za-z0-9_-]+/exec$'
          failed=0
          if [[ -z "$VITE_SCRIPT_URL" ]]; then
            echo "::error::The VITE_SCRIPT_URL repository variable is missing or empty. Add it under Settings → Secrets and variables → Actions → Variables (docs/SETUP.md, step 4.4)."
            failed=1
          elif [[ ! "$VITE_SCRIPT_URL" =~ $script_url_pattern ]]; then
            echo "::error::VITE_SCRIPT_URL must be exactly the web app URL that ends in /exec, with no spaces (docs/SETUP.md, step 3.3). The /dev URL and the editor's address don't work."
            failed=1
          fi
          if [[ -z "$VITE_GOOGLE_CLIENT_ID" ]]; then
            echo "::error::The VITE_GOOGLE_CLIENT_ID repository variable is missing or empty. Add it under Settings → Secrets and variables → Actions → Variables (docs/SETUP.md, step 4.4)."
            failed=1
          elif [[ "$VITE_GOOGLE_CLIENT_ID" =~ [[:space:]] || "$VITE_GOOGLE_CLIENT_ID" != *.apps.googleusercontent.com ]]; then
            echo "::error::VITE_GOOGLE_CLIENT_ID must be exactly the OAuth Client ID, ending in .apps.googleusercontent.com, with no spaces (docs/SETUP.md, step 2.4)."
            failed=1
          fi
          if [[ $failed == 1 ]]; then
            echo "::error::Nothing was deployed, so the live site is unchanged."
            exit 1
          fi
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  e2e:
    runs-on: ubuntu-24.04
    # Never blocks the deploy: a flaky or broken browser smoke test on main must not hold up Pages.
    continue-on-error: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve the installed Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      # A cache hit restores the browser binaries but not their system libraries.
      - run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
