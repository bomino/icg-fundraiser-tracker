<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/icons/icg-monogram.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- theme-color can't reference a CSS variable; keep these two in sync with tokens.css's --color-bg by hand (theme.ts's THEME_COLOR and manifest.webmanifest's background_color/theme_color are the other copies - see CLAUDE.md). The script below reads its colours from these metas, so it holds no copy of its own. -->
    <meta name="theme-color" content="#fbf9f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15110a" media="(prefers-color-scheme: dark)" />
    <title>ICG Fundraiser Tracker</title>
    <script>
      (function () {
        var theme = null;
        try { theme = localStorage.getItem('icg-theme'); } catch (e) { theme = null; }
        if (theme === 'light' || theme === 'dark') {
          // A theme chosen in the app outranks the device's setting, which the metas' media queries follow: both
          // metas take the chosen theme's colour, or the browser bar would stay on the device's under this page.
          var chosen = document.querySelector('meta[name="theme-color"][media="(prefers-color-scheme: ' + theme + ')"]');
          var colour = chosen && chosen.getAttribute('content');
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; colour && i < metas.length; i++) metas[i].setAttribute('content', colour);
        } else {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <!-- Opens the first API call's connections while sign-in runs: the POST to script.google.com and Google's redirect to script.googleusercontent.com for the answer. crossorigin matches api.ts's fetch, which sends no credentials; the browser keeps those connections apart from credentialed ones, so a hint without it would go unused. -->
    <link rel="preconnect" href="https://script.google.com" crossorigin />
    <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin />
    <script src="https://accounts.google.com/gsi/client" async></script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="auth" hidden></div>
    <div id="app"></div>
  </body>
</html>
