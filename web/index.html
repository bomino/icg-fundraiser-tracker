<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/icons/icg-monogram.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- theme-color can't reference a CSS variable; keep these two in sync with tokens.css's --color-bg by hand (manifest.webmanifest's background_color/theme_color are the other copy - see CLAUDE.md). -->
    <meta name="theme-color" content="#fbf9f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15110a" media="(prefers-color-scheme: dark)" />
    <title>ICG Fundraiser Tracker</title>
    <script>
      (function () {
        var theme = null;
        try { theme = localStorage.getItem('icg-theme'); } catch (e) { theme = null; }
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <script src="https://accounts.google.com/gsi/client" async></script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="auth" hidden></div>
    <div id="app"></div>
  </body>
</html>
